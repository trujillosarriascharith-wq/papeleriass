name: papelerias
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  desktop_drop: ^0.8.4
  flutter:
    sdk: flutter
  google_sign_in: ^7.2.0
  http: ^1.6.0
  http_parser: ^4.1.2
  image_picker: ^1.2.3
  image_picker_android: ^0.8.13+25
  image_picker_platform_interface: ^2.11.2
  photo_manager: ^3.12.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
    android: "launcher_icon"
    ios: true
    image_path: "assets/images/logoapp.png"
    min_sdk_android: 21
    adaptive_icon_background: "#22130C"
    adaptive_icon_foreground: "assets/images/logoapp.png"

flutter:
  uses-material-design: true

  assets:
   - assets/images/
   - assets/images/carrusel/
   - assets/icons/ 
   